<title>Déjà acheté ?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: one narrow column, sticky search on top, verdict card, then the full collection grouped by house */
:root{
  --bg:#F6F5F8; --surface:#FFFFFF; --fg:#1E1A26; --muted:#6B6577; --line:#E3E0E8;
  --accent:#8A5414; --yes:#1C7A4A; --yes-bg:#E3F3EA; --maybe:#9A6300; --maybe-bg:#FBF0DA; --no-bg:#EEECF1;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15131A; --surface:#1F1C26; --fg:#EDE9F2; --muted:#A29BAE; --line:#332F3C;
  --accent:#E3A95E; --yes:#5FD39A; --yes-bg:#16382A; --maybe:#F0C060; --maybe-bg:#3A2E14; --no-bg:#26232D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15131A; --surface:#1F1C26; --fg:#EDE9F2; --muted:#A29BAE; --line:#332F3C;
  --accent:#E3A95E; --yes:#5FD39A; --yes-bg:#16382A; --maybe:#F0C060; --maybe-bg:#3A2E14; --no-bg:#26232D; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 12px;display:grid;gap:10px}
h1{font-family:var(--display);font-weight:700;font-size:1.6rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--muted);font-weight:500;font-size:.95rem;margin-left:6px;font-family:var(--body)}
.search{position:relative}
#q{width:100%;box-sizing:border-box;font:inherit;font-size:1.15rem;padding:14px 44px 14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
#q:focus{outline:none;border-color:var(--accent)}
#clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:1.3rem;width:36px;height:36px;border-radius:10px;cursor:pointer}
#clear:focus-visible{outline:2px solid var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:.82rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.verdict{border-radius:16px;padding:16px;margin-block:6px 14px;display:grid;gap:4px}
.verdict b{font-family:var(--display);font-size:1.35rem;font-weight:700}
.verdict.yes{background:var(--yes-bg);color:var(--yes)}
.verdict.maybe{background:var(--maybe-bg);color:var(--maybe)}
.verdict.no{background:var(--no-bg);color:var(--fg)}
.verdict small{color:var(--fg);opacity:.8;font-size:.9rem}

.house{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 6px;font-weight:600}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.name{font-weight:600;font-size:1.02rem;min-width:0}
.brand{font-size:.78rem;color:var(--muted);white-space:nowrap}
.count{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);white-space:nowrap}
.own{display:flex;flex-wrap:wrap;gap:6px}
.own span{font-size:.82rem;background:var(--no-bg);border-radius:8px;padding:3px 8px;font-variant-numeric:tabular-nums}
.note{font-size:.85rem;color:var(--maybe)}
li.item.has-img{grid-template-columns:64px minmax(0,1fr);column-gap:12px}
li.item.has-img>.body{display:grid;gap:6px;min-width:0}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:contain;background:var(--no-bg)}
li.item.close{border-style:dashed}
.foot{color:var(--muted);font-size:.82rem;margin-top:26px}
@media (prefers-reduced-motion:no-preference){.verdict{transition:background .15s}}
</style>

<div class="wrap">

</div>

  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[ً-ْـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي")
    .replace(/\d+\s*ml/g," ").replace(/^ال|\sال/g," ")
    .replace(/[^\p{L}\p{N}]+/gu," ").trim();
}
function toks(s){return norm(s).split(" ").filter(t=>t&&!STOP.has(t))}
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function tokMatch(q,t){
  if(/^\d+$/.test(q)) return t===q;
  if(t.startsWith(q)) return true;
  if(q.length>=4){const d=lev(q,t.slice(0,Math.max(q.length,t.length)));return d<=(q.length>=7?2:1)}
  return false;
}
const IDX=D.map(([name,brand,alias,own,note])=>({name,brand,own,note,nameT:toks(name),allT:toks(name+" "+alias)}));
IDX.forEach(x=>x.total=x.own.reduce((s,o)=>s+o[1],0));

let house="Toutes";
const $=id=>document.getElementById(id);
$("total").textContent=IDX.length+" parfums";
$("chips").innerHTML=HOUSES.map(h=>`<button class="chip" type="button" data-h="${h}" aria-pressed="${h===house}">${h}</button>`).join("");
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;house=b.dataset.h;[...document.querySelectorAll(".chip")].forEach(c=>c.setAttribute("aria-pressed",c.dataset.h===house));render()});

function card(x,close){
  const img=IMG[x.name];
  const body=`<div class="top"><span class="name">${x.name}</span><span class="count">×${x.total}</span></div>
  <div class="brand">${x.brand}</div>
  <div class="own">${x.own.map(o=>`<span>${o[1]} × ${o[0]} · ${o[2]}</span>`).join("")}</div>
  ${x.note?`<div class="note">${x.note}</div>`:""}`;
  return `<li class="item${close?" close":""}${img?" has-img":""}">${img?`<img class="thumb" src="${img}" alt="" loading="lazy"><div class="body">${body}</div>`:body}</li>`;
}
function render(){
  const raw=$("q").value; const q=toks(raw);
  $("clear").hidden=!raw;
  const pool=IDX.filter(x=>house==="Toutes"||x.brand===house);
  const v=$("verdict");
  if(!q.length){
    v.hidden=true;
    const groups=HOUSES.slice(1).filter(h=>house==="Toutes"||h===house);
    $("list").innerHTML=groups.map(h=>`<div class="house">${h}</div><ul>${pool.filter(x=>x.brand===h).map(x=>card(x)).join("")}</ul>`).join("");
    return;
  }
  const full=[],close=[];
  pool.forEach(x=>{
    const hits=q.filter(qt=>x.allT.some(t=>tokMatch(qt,t))).length;
    if(hits===q.length) full.push(x); else if(hits>0) close.push(x);
  });
  // a full match on the name itself ranks first
  full.sort((a,b)=>(b.nameT.length===q.length)-(a.nameT.length===q.length));
  v.hidden=false;
  if(full.length){
    v.className="verdict yes";
    v.innerHTML=`<b>Oui, tu l'as déjà</b><small>${full.length>1?full.length+" parfums correspondent, vérifie lequel":"Détail ci-dessous"}</small>`;
  }else if(close.length){
    v.className="verdict maybe";
    v.innerHTML=`<b>Pas exactement</b><small>Tu as des parfums proches, vérifie que ce n'est pas le même</small>`;
  }else{
    v.className="verdict no";
    v.innerHTML=`<b>Pas encore acheté</b><small>Rien dans ta liste ne ressemble à « ${raw.replace(/[<>&]/g,"")} »</small>`;
  }
  $("list").innerHTML=(full.length?`<ul>${full.map(x=>card(x)).join("")}</ul>`:"")+
    (close.length?`<div class="house">Proches</div><ul>${close.slice(0,6).map(x=>card(x,true)).join("")}</ul>`:"");
}
$("q").addEventListener("input",render);
$("clear").addEventListener("click",()=>{$("q").value="";render();$("q").focus()});
render();
</script>
