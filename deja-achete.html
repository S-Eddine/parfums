<title>Déjà acheté ?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: sticky search on top, verdict, then a photo-first grid. Full sizes are grouped by house; 10 ml minis live in their own section */
:root{
  --bg:#F6F5F8; --surface:#FFFFFF; --fg:#1E1A26; --muted:#6B6577; --line:#E3E0E8;
  --accent:#8A5414; --on-accent:#FFFFFF; --yes:#1C7A4A; --yes-bg:#E3F3EA; --maybe:#9A6300; --maybe-bg:#FBF0DA; --no-bg:#EEECF1;
  --mini:#4B3F8F; --mini-bg:#ECE9FA;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15131A; --surface:#1F1C26; --fg:#EDE9F2; --muted:#A29BAE; --line:#332F3C;
  --accent:#E3A95E; --on-accent:#1E1A26; --yes:#5FD39A; --yes-bg:#16382A; --maybe:#F0C060; --maybe-bg:#3A2E14; --no-bg:#26232D;
  --mini:#C9BFFF; --mini-bg:#2E2850; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15131A; --surface:#1F1C26; --fg:#EDE9F2; --muted:#A29BAE; --line:#332F3C;
  --accent:#E3A95E; --on-accent:#1E1A26; --yes:#5FD39A; --yes-bg:#16382A; --maybe:#F0C060; --maybe-bg:#3A2E14; --no-bg:#26232D;
  --mini:#C9BFFF; --mini-bg:#2E2850; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:grid;gap:10px}
h1{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0;letter-spacing:-.01em}
h1 span{color:var(--muted);font-weight:500;font-size:.9rem;margin-left:6px;font-family:var(--body)}
.search{position:relative}
#q{width:100%;box-sizing:border-box;font:inherit;font-size:1.15rem;padding:13px 44px 13px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
#q::-webkit-search-cancel-button{display:none}
#q:focus{outline:none;border-color:var(--accent)}
#clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:1.4rem;width:40px;height:40px;border-radius:10px;cursor:pointer}
#clear:focus-visible{outline:2px solid var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:.85rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.mini-chip{color:var(--mini);border-color:var(--mini)}
.chip.mini-chip[aria-pressed="true"]{background:var(--mini);color:var(--bg)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.verdict[hidden]{display:none}
.verdict{border-radius:14px;padding:12px 14px;margin-block:4px 10px;display:grid;gap:2px}
.verdict b{font-family:var(--display);font-size:1.25rem;font-weight:700}
.verdict.yes{background:var(--yes-bg);color:var(--yes)}
.verdict.maybe{background:var(--maybe-bg);color:var(--maybe)}
.verdict.no{background:var(--no-bg);color:var(--fg)}
.verdict small{color:var(--fg);opacity:.8;font-size:.88rem}

.sec{display:flex;align-items:baseline;gap:8px;margin:20px 0 8px}
.sec h2{font-family:var(--display);font-size:1.05rem;font-weight:700;margin:0}
.sec span{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.sec.mini h2{color:var(--mini)}
ul.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
@media (min-width:600px){ul.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card.close{border-style:dashed}
.ph{position:relative;aspect-ratio:3/4;background:#FFFFFF}
.ph img{display:block;width:100%;height:100%;object-fit:contain}
.ph.empty{background:var(--no-bg);display:grid;place-items:center;text-align:center}
.ph.empty .ph-txt{padding:12px;font-family:var(--display);font-weight:700;color:var(--muted);font-size:1.05rem;text-wrap:balance}
.qty{position:absolute;top:6px;right:6px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:.8rem;padding:1px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.tag{position:absolute;top:6px;left:6px;background:var(--mini);color:var(--bg);font-weight:600;font-size:.72rem;padding:2px 7px;border-radius:999px}
.meta{padding:6px 8px 8px;display:grid;gap:2px;min-width:0}
.name{font-weight:650;font-size:.88rem;line-height:1.25;overflow-wrap:anywhere}
.sub{font-size:.74rem;color:var(--muted)}
.fmt{font-size:.76rem;font-variant-numeric:tabular-nums}
.prov{font-size:.75rem;color:var(--muted)}
.note{font-size:.76rem;color:var(--maybe);line-height:1.3}
#list.browse .prov,#list.browse .note,#list.browse .house-sec .sub{display:none}
.foot{color:var(--muted);font-size:.8rem;margin-top:26px}
</style>

<div class="wrap">
  <header>
    <h1>Déjà acheté ?<span id="total"></span></h1>
    <div class="search">

      <button id="clear" type="button" aria-label="Effacer" hidden>×</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filtrer"></div>

  <div id="verdict" class="verdict no" hidden></div>

</div>

};
const HOUSES=["IBRAQ","Assaf","Arabian Oud","Reef"];
const MINI="10 ml";
const FILTERS=["Toutes",...HOUSES,MINI];
const STOP=new Set(["diamond","perfume","parfum","edp","edt","eau","de","ml","the","عطر","ibraq","ابراق","assaf","عساف","arabian","oud"]);

function norm(s){
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[ً-ْـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي")
    .replace(/\d+\s*ml/g," ").replace(/^ال|\sال/g," ")
    .replace(/[^\p{L}\p{N}]+/gu," ").trim();
}
function toks(s){return norm(s).split(" ").filter(t=>t&&!STOP.has(t))}
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function tokMatch(q,t){
  if(/^\d+$/.test(q)) return t===q;
  if(t.startsWith(q)) return true;
  if(q.length>=4){const d=lev(q,t.slice(0,Math.max(q.length,t.length)));return d<=(q.length>=7?2:1)}
  return false;
}
const isMini=o=>/^10\s*ml$/i.test(o[0]);
const IDX=D.map(([name,brand,alias,own,note])=>({name,brand,own,note,nameT:toks(name),allT:toks(name+" "+alias)}));
// each perfume becomes one card per size group: full sizes, and 10 ml minis kept apart
IDX.forEach(x=>{
  x.views=[];
  const full=x.own.filter(o=>!isMini(o)), mini=x.own.filter(isMini);
  if(full.length) x.views.push({x,own:full,mini:false});
  if(mini.length) x.views.push({x,own:mini,mini:true});
});
const VIEWS=IDX.flatMap(x=>x.views);
const sum=v=>v.own.reduce((s,o)=>s+o[1],0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let filter="Toutes";
const $=id=>document.getElementById(id);
$("total").textContent=IDX.length+" parfums";
$("chips").innerHTML=FILTERS.map(h=>`<button class="chip${h===MINI?" mini-chip":""}" type="button" data-h="${h}" aria-pressed="${h===filter}">${h}</button>`).join("");
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;filter=b.dataset.h;[...document.querySelectorAll(".chip")].forEach(c=>c.setAttribute("aria-pressed",c.dataset.h===filter));render()});

function inFilter(v){return filter==="Toutes"||(filter===MINI?v.mini:v.x.brand===filter)}
function card(v,close){
  const x=v.x, img=IMG[x.name];
  const ph=img?`<div class="ph"><img src="${img}" alt="${esc(x.name)}" loading="lazy">`:`<div class="ph empty"><span class="ph-txt">${esc(x.name)}</span>`;
  return `<li class="card${close?" close":""}">${ph}<span class="qty">×${sum(v)}</span>${v.mini?`<span class="tag">10 ml</span>`:""}</div>
  <div class="meta"><div class="name">${esc(x.name)}</div><div class="sub">${esc(x.brand)}</div>
  <div class="fmt">${v.own.map(o=>`${o[1]} × ${esc(o[0])}`).join(" · ")}</div>
  <div class="prov">${v.own.map(o=>esc(o[2])).join(" · ")}</div>
  ${x.note?`<div class="note">${esc(x.note)}</div>`:""}</div></li>`;
}
function section(title,views,mini){
  if(!views.length) return "";
  return `<div class="sec${mini?" mini":""}"><h2>${title}</h2><span>${views.length}</span></div><ul class="grid${mini?"":" house-sec"}">${views.map(v=>card(v)).join("")}</ul>`;
}
function render(){
  const raw=$("q").value; const q=toks(raw);
  $("clear").hidden=!raw;
  const v=$("verdict"), list=$("list");
  if(!q.length){
    v.hidden=true; list.className="browse";
    const pool=VIEWS.filter(inFilter);
    const houses=HOUSES.filter(h=>filter==="Toutes"||filter===MINI||h===filter);
    list.innerHTML=houses.map(h=>section(h,pool.filter(w=>!w.mini&&w.x.brand===h))).join("")
      +section(MINI,pool.filter(w=>w.mini),true);
    return;
  }
  list.className="results";
  const full=[],close=[];
  IDX.forEach(x=>{
    const vs=x.views.filter(inFilter); if(!vs.length) return;
    const hits=q.filter(qt=>x.allT.some(t=>tokMatch(qt,t))).length;
    if(hits===q.length) full.push(x); else if(hits>0) close.push(x);
  });
  // a full match on the name itself ranks first
  full.sort((a,b)=>(b.nameT.length===q.length)-(a.nameT.length===q.length));
  v.hidden=false;
  if(full.length){
    v.className="verdict yes";
    v.innerHTML=`<b>Oui, tu l'as déjà</b><small>${full.length>1?full.length+" parfums correspondent, vérifie lequel":"Détail ci-dessous"}</small>`;
  }else if(close.length){
    v.className="verdict maybe";
    v.innerHTML=`<b>Pas exactement</b><small>Tu as des parfums proches, vérifie que ce n'est pas le même</small>`;
  }else{
    v.className="verdict no";
    v.innerHTML=`<b>Pas encore acheté</b><small>Rien dans ta liste ne ressemble à « ${esc(raw)} »</small>`;
  }
  const cards=(xs,c)=>xs.flatMap(x=>x.views.filter(inFilter)).map(w=>card(w,c)).join("");
  list.innerHTML=(full.length?`<ul class="grid">${cards(full)}</ul>`:"")+
    (close.length?`<div class="sec"><h2>Proches</h2></div><ul class="grid">${cards(close.slice(0,6),true)}</ul>`:"");
}
$("q").addEventListener("input",render);
$("clear").addEventListener("click",()=>{$("q").value="";render();$("q").focus()});
render();
</script>
